[package]
name = "rchain_gdext"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
godot = { version = "0.5.5", features = ["api-4-4"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
blake2 = "0.10"
sha3 = "0.10"
bs58 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 2
